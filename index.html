<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Digital Clock with Voice</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #111;
      color: #0f0;
      font-family: 'Courier New', monospace;
      flex-direction: column;
    }

    #clock {
      font-size: 60px;
      letter-spacing: 3px;
      padding: 20px 40px;
      border: 2px solid #0f0;
      border-radius: 10px;
      box-shadow: 0 0 20px #0f0;
      margin-bottom: 20px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="clock">00:00:00</div>
  <button onclick="toggleVoice()">Enable Voice</button>

  <script>
    let voiceEnabled = false;
    let lastSpokenMinute = null;

    function speak(text) {
      const speech = new SpeechSynthesisUtterance(text);
      speech.rate = 1;
      speech.pitch = 1;
      speech.lang = "en-US";
      window.speechSynthesis.speak(speech);
    }

    function updateClock() {
      const now = new Date();

      let hours = now.getHours();
      let minutes = now.getMinutes();
      let seconds = now.getSeconds();

      const displayHours = hours < 10 ? "0" + hours : hours;
      const displayMinutes = minutes < 10 ? "0" + minutes : minutes;
      const displaySeconds = seconds < 10 ? "0" + seconds : seconds;

      document.getElementById("clock").textContent =
        `${displayHours}:${displayMinutes}:${displaySeconds}`;

      // Speak once per minute
      if (voiceEnabled && minutes !== lastSpokenMinute) {
        lastSpokenMinute = minutes;

        let period = hours >= 12 ? "PM" : "AM";
        let spokenHours = hours % 12 || 12;

        speak(`The time is ${spokenHours} ${minutes} ${period}`);
      }
    }

    function toggleVoice() {
      voiceEnabled = !voiceEnabled;
      document.querySelector("button").textContent =
        voiceEnabled ? "Disable Voice" : "Enable Voice";
    }

    setInterval(updateClock, 1000);
    updateClock();
  </script>

</body>
</html>
